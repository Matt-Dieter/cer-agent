<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CERtain</title>
    <!-- Police Lato : chargée sans bloquer l'affichage (si Google Fonts est lent ou bloqué, le site s'ouvre quand même avec une police de secours) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&display=swap" /></noscript>
    <meta name="description" content="Ton CER de prosit rédigé et déposé à temps sur Moodle." />
      <script>
      // Thème choisi (clair / sombre), appliqué avant l'affichage pour éviter un flash
      try { var t = localStorage.getItem("certain-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
